name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac
            os: macos-latest
            preset: ci-mac
            validator: macos-universal.zip
            validator-sha256: bbec8cd7d18274e549d5d8c12ece3cec54be966129388dd2e742b9957f2ba9f1
          - name: Windows
            os: windows-latest
            preset: ci-windows
            validator: windows.zip
            validator-sha256: d935c3af0a45c3911ea2e900f4aa5d6709dac82bb485f0c4ce28648ab2cd0c10
          - name: Linux
            os: ubuntu-latest
            preset: ci-linux
            validator: ubuntu-22.04.zip
            validator-sha256: 49edadcfb407ea0dd946ce418300e853fbd2660fa4b0d00e4f19ff8eef24ad90
          # The validator can't load a plugin built with the sanitizers, which must be the first thing a process loads.
          - name: Linux with sanitizers
            os: ubuntu-latest
            preset: ci-linux-sanitizers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The number tests check writing and reading in a locale with a decimal comma.
      - name: German locale
        if: runner.os == 'Linux'
        run: sudo locale-gen de_DE.UTF-8

      # CLAP's validator, pinned by checksum, checks every CLAP plugin the build makes.
      - name: CLAP validator
        if: matrix.validator
        shell: bash
        env:
          ASSET: clap-validator-0.4.1-127-g152b982-${{ matrix.validator }}
          SHA256: ${{ matrix.validator-sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/clap-validator" && cd "$RUNNER_TEMP/clap-validator"
          curl -sSfL -o validator.zip "https://github.com/free-audio/clap-validator/releases/download/0.4.1/$ASSET"
          if command -v shasum > /dev/null; then actual=$(shasum -a 256 validator.zip | cut -d' ' -f1); else actual=$(sha256sum validator.zip | cut -d' ' -f1); fi
          [ "$actual" = "$SHA256" ] || { echo "validator.zip has checksum $actual, not $SHA256"; exit 1; }
          unzip -q validator.zip
          for archive in *.tar.gz; do if [ -e "$archive" ]; then tar xzf "$archive"; fi; done
          validator=$(find "$PWD" -type f \( -name clap-validator -o -name clap-validator.exe \) | head -n 1)
          [ -n "$validator" ] || { echo "No clap-validator in $ASSET"; exit 1; }
          chmod +x "$validator"
          if [ "$RUNNER_OS" = "Windows" ]; then validator=$(cygpath -m "$validator"); fi
          echo "CLAP_VALIDATOR=-DSYMBOLENGINE_CLAP_VALIDATOR=$validator" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: cmake --preset ${{ matrix.preset }} $CLAP_VALIDATOR
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  sign-off:
    name: Sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git show -s --format=%ae "$commit")
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$commit" | grep -qiF "<$email>"; then
              echo "::error::$(git show -s --format='%h %s' "$commit") has no Signed-off-by line from its author, $email"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off each commit with git commit -s, as CONTRIBUTING.md describes."
          fi
          exit "$missing"
