name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac
            os: macos-latest
            preset: ci-mac
            validator: macos-universal.zip
            validator-sha256: bbec8cd7d18274e549d5d8c12ece3cec54be966129388dd2e742b9957f2ba9f1
            pluginval: macOS
            pluginval-sha256: 3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f
          - name: Windows
            os: windows-latest
            preset: ci-windows
            validator: windows.zip
            validator-sha256: d935c3af0a45c3911ea2e900f4aa5d6709dac82bb485f0c4ce28648ab2cd0c10
            pluginval: Windows
            pluginval-sha256: c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab
          - name: Linux
            os: ubuntu-latest
            preset: ci-linux
            validator: ubuntu-22.04.zip
            validator-sha256: 49edadcfb407ea0dd946ce418300e853fbd2660fa4b0d00e4f19ff8eef24ad90
            pluginval: Linux
            pluginval-sha256: c01c49d8063965c4c2dea8324468336768f5c9139e0b1caebde14c2400b55352
          # The validator can't load a plugin built with the sanitizers, which must be the first thing a process loads.
          - name: Linux with sanitizers
            os: ubuntu-latest
            preset: ci-linux-sanitizers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The number tests check writing and reading in a locale with a decimal comma.
      - name: German locale
        if: runner.os == 'Linux'
        run: sudo locale-gen de_DE.UTF-8

      # The plugin validators, each pinned by checksum: CLAP's, and pluginval, a separate GPL tool run on the plugins.
      # Steinberg's is built from the VST3 SDK, and auval comes with macOS.
      - name: Validators
        if: matrix.validator
        shell: bash
        env:
          CLAP_ASSET: clap-validator-0.4.1-127-g152b982-${{ matrix.validator }}
          CLAP_SHA256: ${{ matrix.validator-sha256 }}
          PLUGINVAL_ASSET: pluginval_${{ matrix.pluginval }}.zip
          PLUGINVAL_SHA256: ${{ matrix.pluginval-sha256 }}
        run: |
          fetch() { # fetch <folder> <url> <sha256>
            mkdir -p "$RUNNER_TEMP/$1" && cd "$RUNNER_TEMP/$1"
            curl -sSfL -o download.zip "$2"
            if command -v shasum > /dev/null; then actual=$(shasum -a 256 download.zip | cut -d' ' -f1); else actual=$(sha256sum download.zip | cut -d' ' -f1); fi
            [ "$actual" = "$3" ] || { echo "$2 has checksum $actual, not $3"; exit 1; }
            unzip -q download.zip
            for archive in *.tar.gz; do if [ -e "$archive" ]; then tar xzf "$archive"; fi; done
          }
          found() { # found <folder> <name>: the path of the program, as CMake on this system takes it
            program=$(find "$RUNNER_TEMP/$1" -type f \( -name "$2" -o -name "$2.exe" \) | head -n 1)
            [ -n "$program" ] || { echo "No $2 in $RUNNER_TEMP/$1"; exit 1; }
            chmod +x "$program"
            if [ "$RUNNER_OS" = "Windows" ]; then cygpath -m "$program"; else echo "$program"; fi
          }

          fetch clap-validator "https://github.com/free-audio/clap-validator/releases/download/0.4.1/$CLAP_ASSET" "$CLAP_SHA256"
          clap_validator=$(found clap-validator clap-validator)
          fetch pluginval "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/$PLUGINVAL_ASSET" "$PLUGINVAL_SHA256"
          pluginval=$(found pluginval pluginval)

          # pluginval needs a display on Linux, so there it runs on a virtual one.
          if [ "$RUNNER_OS" = "Linux" ]; then
            command -v xvfb-run > /dev/null || { sudo apt-get update && sudo apt-get install -y xvfb; }
            printf '#!/bin/sh\nexec xvfb-run -a "%s" "$@"\n' "$pluginval" > "$RUNNER_TEMP/pluginval-headless"
            chmod +x "$RUNNER_TEMP/pluginval-headless"
            pluginval="$RUNNER_TEMP/pluginval-headless"
          fi

          options="-DSYMBOLENGINE_CLAP_VALIDATOR=$clap_validator -DSYMBOLENGINE_PLUGINVAL=$pluginval"
          if [ "$RUNNER_OS" = "macOS" ]; then options="$options -DSYMBOLENGINE_AUVAL=ON -DSYMBOLENGINE_TEST_INTEL_AUDIO_UNITS=ON"; fi
          if [ "$RUNNER_OS" != "Linux" ]; then options="$options -DSYMBOLENGINE_PLUGINVAL_EDITORS=ON"; fi
          echo "VALIDATORS=$options" >> "$GITHUB_ENV"

      # BlackHole's loopback devices on the Mac, a test tool alone (GPL-3.0, never shipped), so Core Audio's own paths
      # are tested with no hardware: what is played to a device comes back as its input and reaches no speaker.
      - name: Loopback devices
        if: runner.os == 'macOS'
        run: |
          brew install --cask blackhole-2ch blackhole-16ch
          # Core Audio loads a new driver only as its service starts, so it is restarted, and the devices waited for.
          sudo killall coreaudiod || true
          for i in $(seq 1 30); do
            listed=$(system_profiler SPAudioDataType | grep -c "BlackHole" || true)
            [ "$listed" -ge 2 ] && break
            sleep 2
          done
          system_profiler SPAudioDataType | grep "BlackHole"
          echo "SYMBOLENGINE_TEST_LOOPBACK=BlackHole" >> "$GITHUB_ENV"

      # Steinberg's ASIO SDK on Windows, for the ASIO layer and its tests against fake drivers, pinned by checksum
      # and fetched for the run alone: the SDK is the developer's own, under Steinberg's terms, never in this repository.
      - name: ASIO SDK
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/asio" && cd "$RUNNER_TEMP/asio"
          curl -sSfL -o sdk.zip https://download.steinberg.net/sdk_downloads/ASIO-SDK_2.3.4_2025-10-15.zip
          actual=$(sha256sum sdk.zip | cut -d' ' -f1)
          [ "$actual" = "d5ebf0c20dd2c5f43771fd0c1418f4b361bf52434ee670097cfa6b3a335e2eca" ] || { echo "The ASIO SDK has checksum $actual"; exit 1; }
          unzip -q sdk.zip
          echo "ASIO=-DSYMBOLENGINE_ASIO_SDK=$(cygpath -m "$RUNNER_TEMP/asio/ASIOSDK")" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: cmake --preset ${{ matrix.preset }} $VALIDATORS $ASIO
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  sign-off:
    name: Sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git show -s --format=%ae "$commit")
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$commit" | grep -qiF "<$email>"; then
              echo "::error::$(git show -s --format='%h %s' "$commit") has no Signed-off-by line from its author, $email"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off each commit with git commit -s, as CONTRIBUTING.md describes."
          fi
          exit "$missing"
